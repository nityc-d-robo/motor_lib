[package]
name = "motor_lib"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
rusb = "0.9"
tonic = "0.14.5"
prost = "0.14.4"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }
socketcan = "3.6.2"
tonic-prost = "0.14.5"
strum = { version = "0.28.0", features = ["derive"] }
strum_macros =  "0.28.0"

[build-dependencies]
protox = "0.9.1"
tonic-build = "0.14.5"
tonic-prost-build = "0.14.5"
tonic-prost = "0.14.5"

[[example]]
name = "sample_1"
path = "src/bin/examples/sample_1.rs"
[[example]]
name = "sample_2"
path = "src/bin/examples/sample_2.rs"
[[example]]
name = "test_controller"
path = "src/bin/examples/test_controller.rs"
